name: Deploy

# Deploys main to production after the Build workflow passes on a push to main.
# Can also be run by hand (Actions > Deploy > Run workflow) to redeploy main.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits for the running deploy instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # AWS credentials are only issued to jobs in this environment, which only main can use.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run: deploy exactly the commit that passed Build.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.34.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Deploy
        working-directory: apps/cdk
        run: pnpm exec cdk deploy --all --require-approval never
